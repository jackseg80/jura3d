name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/test-territory.mjs
      - run: node scripts/test-parking.mjs
      - run: node scripts/test-transport-geometry.mjs
      - run: npm run build
      - run: node scripts/check-build.mjs dist /
      - run: npm run build:site
        env:
          JURA3D_BASE_PATH: /jura3d/
