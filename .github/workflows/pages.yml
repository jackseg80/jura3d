name: Publish test site

# Publication explicite uniquement : un push ne déploie pas le site.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/test-territory.mjs
      - run: node scripts/test-building-clip.mjs
      - run: node scripts/test-parking.mjs
      - run: node scripts/test-basel-transit.mjs
      - run: node scripts/test-transport-raster.mjs
      - run: node scripts/test-transport-geometry.mjs
      - run: npm run build:site
        env:
          JURA3D_BASE_PATH: /jura3d/
      - run: node scripts/check-site.mjs dist-site /jura3d/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
